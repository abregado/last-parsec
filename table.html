<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Last Parsec · Table view</title>
  <link rel="stylesheet" href="css/table.css?v=20261027220819">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var savedTheme = localStorage.getItem('lastParsec.theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) { /* storage unavailable: keep the default */ }
  </script>
</head>
<body>
  <div id="table-root"></div>

  <script src="js/lp.js?v=20261027220819"></script>
  <script src="js/data/tables.js?v=20261027220819"></script>
  <script src="js/core/rng.js?v=20261027220819"></script>
  <script src="js/core/tableStore.js?v=20261027220819"></script>
  <script src="js/ui/dom.js?v=20261027220819"></script>
  <script src="js/ui/tableView.js?v=20261027220819"></script>
  <script>LP.tableView.start(document.getElementById('table-root'));</script>
</body>
</html>
